      - name: Download package
        working-directory: ./openwrt
        run: |
          make defconfig

          # Force inject PARTSIZE
          if grep -q "CONFIG_TARGET_ROOTFS_PARTSIZE" .config; then
            sed -i 's/CONFIG_TARGET_ROOTFS_PARTSIZE=.*/CONFIG_TARGET_ROOTFS_PARTSIZE=1024/' .config
          else
            echo "CONFIG_TARGET_ROOTFS_PARTSIZE=1024" >> .config
          fi

          # Force enable EXT4FS
          if grep -q "CONFIG_TARGET_ROOTFS_EXT4FS" .config; then
            sed -i 's/CONFIG_TARGET_ROOTFS_EXT4FS=.*/CONFIG_TARGET_ROOTFS_EXT4FS=y/' .config
          else
            echo "CONFIG_TARGET_ROOTFS_EXT4FS=y" >> .config
          fi

          # Force remove ALL passwall packages
          sed -i '/CONFIG_PACKAGE_luci-app-passwall/d' .config
          sed -i '/CONFIG_PACKAGE_passwall/d' .config
          cat >> .config << 'EOF'
CONFIG_PACKAGE_luci-app-passwall=n
CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Haproxy=n
CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Shadowsocks_Rust_Client=n
CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Shadowsocks_Rust_Server=n
CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Simple_Obfs=n
CONFIG_PACKAGE_luci-app-passwall_INCLUDE_SingBox=n
CONFIG_PACKAGE_luci-app-passwall_INCLUDE_V2ray_Geoview=n
CONFIG_PACKAGE_luci-app-passwall_INCLUDE_V2ray_Plugin=n
CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Xray=n
EOF

          # Re-run defconfig
          make defconfig

          # Force remove passwall AGAIN after defconfig
          sed -i 's/CONFIG_PACKAGE_luci-app-passwall_INCLUDE_.*=y/CONFIG_PACKAGE_luci-app-passwall_INCLUDE_DISABLED=n/' .config
          sed -i 's/CONFIG_PACKAGE_luci-app-passwall=y/CONFIG_PACKAGE_luci-app-passwall=n/' .config

          # Verify
          echo "========== Config Verification =========="
          grep "ROOTFS_PARTSIZE" .config || true
          grep "ROOTFS_EXT4FS" .config || true
          grep "luci-app-amlogic" .config || echo "WARN: amlogic not found"
          grep "openclash" .config || echo "WARN: openclash not found"
          grep "homeproxy" .config || echo "WARN: homeproxy not found"
          grep "passwall.*=y" .config && echo "FAIL: passwall still enabled" || echo "OK: all passwall removed"
          grep "daed" .config || echo "OK: daed removed"
          echo "========================================="

          make download -j$(( $(nproc) * 2 ))
          find dl -size -1k -exec rm -f {} \;
