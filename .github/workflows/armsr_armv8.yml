name: Build ImmortalWrt-25.12 for Phicomm N1

on:
  workflow_dispatch:
    inputs:
      ssh:
        description: "SSH connection to Actions"
        required: true
        default: "false"
        type: choice
        options:
          - true
          - false
  schedule:
    - cron: "0 0 1,16 * *"

permissions:
  contents: write

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: openwrt-25.12
  TZ: Asia/Shanghai
  CCACHE_DIR: /workdir/openwrt/.ccache

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -qq update > /dev/null
          sudo -E apt-get -qq install -y $(curl -fsSL https://raw.githubusercontent.com/nantayo/My-Pkg/master/openwrt) > /dev/null
          sudo -E apt-get -qq autoremove --purge > /dev/null
          sudo -E apt-get -qq clean > /dev/null
          sudo timedatectl set-timezone "$TZ"
          sudo mkdir -p /workdir
          sudo chown $USER:$GROUPS /workdir

      - name: Clone source code
        working-directory: /workdir
        run: |
          git clone $REPO_URL -b $REPO_BRANCH --single-branch --depth=1 openwrt
          ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt
          echo "FILE_DATE=$(date +%Y%m%d)" >> $GITHUB_ENV

      - name: Cache downloads and ccache
        uses: actions/cache@v4
        with:
          path: |
            /workdir/openwrt/dl
            /workdir/openwrt/.ccache
          key: ${{ runner.os }}-openwrt-25.12-${{ hashFiles('armsr/armv8/N1/.config') }}
          restore-keys: |
            ${{ runner.os }}-openwrt-25.12-

      - name: Update and Install feeds
        run: |
          chmod +x armsr/armv8/diy/diy.sh
          cd openwrt
          ./scripts/feeds update -a
          $GITHUB_WORKSPACE/armsr/armv8/diy/diy.sh
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load N1 custom config
        run: |
          rm -rf openwrt/files openwrt/.config
          mv armsr/armv8/N1/files armsr/armv8/N1/.config openwrt/

      - name: SSH connect to Actions
        uses: P3TERX/ssh2actions@v1.0.0
        if: github.event.inputs.ssh == 'true'

      - name: Download package
        working-directory: ./openwrt
        run: |
          make defconfig

          echo "========== Config Verification =========="
          grep "ROOTFS_PARTSIZE" .config || true
          grep "ROOTFS_EXT4FS" .config || true
          grep "luci-app-amlogic" .config || echo "WARN: amlogic not found"
          grep "luci-app-openclash" .config || echo "WARN: openclash not found"
          grep "CONFIG_PACKAGE_luci-app-passwall=y" .config && echo "FAIL: passwall enabled (*.config is authoritative*)" || echo "OK: passwall disabled"
          grep "CONFIG_PACKAGE_luci-app-rclone=y" .config && echo "FAIL: rclone enabled (*.config is authoritative*)" || echo "OK: rclone disabled"
          echo "========================================="

          make download -j$(( $(nproc) * 2 ))
          BAD=$(find dl -type f -size -1k 2>/dev/null || true)
          if [ -n "$BAD" ]; then
            echo "WARN: removing suspicious empty/truncated downloads:"
            printf '%s\n' "$BAD"
            printf '%s\n' "$BAD" | xargs -r rm -f
          fi

      - name: Compile N1 firmware
        run: |
          cd openwrt
          echo "$(nproc) thread compile"
          make -j$(nproc) || make -j1 V=s

      - name: Package N1 firmware
        uses: ophub/amlogic-s9xxx-openwrt@30f81d60774bfc00865e16bfb33d6c80a1261033
        with:
          openwrt_path: openwrt/bin/targets/armsr/armv8/*rootfs.tar.gz
          openwrt_board: s905d
          kernel_repo: ophub/kernel
          kernel_usage: flippy
          openwrt_kernel: 6.12.y
          openwrt_size: 256/1024
          builder_name: nantayo

      - name: Generate firmware info
        run: |
          IMG_FILE=$(ls ${{ env.PACKAGED_OUTPUTPATH }}/*.img.gz 2>/dev/null | head -1)
          if [ -n "$IMG_FILE" ]; then
            KERNEL_VER=$(basename "$IMG_FILE" | sed 's/.*k\([0-9]*\.[0-9]*\.[0-9]*\).*/\1/')
          fi
          if [ -z "$KERNEL_VER" ]; then
            KERNEL_VER=$(grep -o '[0-9]*\.[0-9]*\.[0-9]*' openwrt/bin/targets/armsr/armv8/version.buildinfo 2>/dev/null | head -1)
          fi
          echo "KERNEL_VER=${KERNEL_VER:-unknown}" >> $GITHUB_ENV

          PLUGINS=$(grep 'CONFIG_PACKAGE_luci-app-.*=y' openwrt/.config | sed 's/CONFIG_PACKAGE_//;s/=y//' | sort | tr '\n' ' ')
          echo "PLUGINS_LIST=${PLUGINS}" >> $GITHUB_ENV

          OW_VER=$(head -1 openwrt/bin/targets/armsr/armv8/version.buildinfo 2>/dev/null | awk '{print $2}') || true
          echo "OW_VER=${OW_VER:-ImmortalWrt 25.12}" >> $GITHUB_ENV

          echo "=========================================="
          echo "  Kernel:  ${KERNEL_VER:-unknown}"
          echo "  Plugins: ${PLUGINS}"
          echo "  Version: ${OW_VER:-ImmortalWrt 25.12}"
          echo "=========================================="

      - name: Upload firmware to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: OpenWrt_${{ env.FILE_DATE }}-${{ github.run_number }}
          files: ${{ env.PACKAGED_OUTPUTPATH }}/*.img.gz
          body: |
            ## Firmware Info

            | Item | Detail |
            |------|--------|
            | System | ${{ env.OW_VER }} |
            | Kernel | ${{ env.KERNEL_VER }} |
            | Device | Phicomm N1 (S905D) |
            | Build Date | ${{ env.FILE_DATE }} |

            ## Installed Plugins

            ```
            ${{ env.PLUGINS_LIST }}
            ```

            ## Default Settings

            | Item | Value |
            |------|-------|
            | IP | 192.168.68.68 |
            | Gateway | 192.168.68.1 |
            | User | root |
            | Password | password |
            | DTB | meson-gxl-s905d-p230.dtb |

      - name: Delete old releases
        uses: mgz0227/delete-older-releases@v0.3.4
        with:
          keep_latest: 2
          delete_tags: true
